<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Virtual Piano</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <style>

    body{
        margin:0;
        padding:0;
        background:#111;
        color:white;
        font-family:Arial;
        text-align:center;
    }

    h1{
        margin-top:20px;
        margin-bottom:10px;
    }

    .container{
        position:relative;
        width:1000px;
        margin:auto;
    }

    video{
        display:none;
    }

    .output_canvas{
        width:1000px;
        height:700px;
        border:2px solid white;
        border-radius:10px;
        background:black;
    }

    /*  [SRS 4.4] 연주 환경 맞춤형 UI 제어 패널 스타일 컨트롤 디자인 추가 */

    #piano-controls {
        width: 976px; /* 캔버스 너비 1000px에서 패딩/테두리 여백을 고려한 최적 크기 */
        margin: 0 auto 15px auto;
        padding: 10px 12px;
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        display: flex;
        gap: 30px;
        align-items: center;
        justify-content: flex-start;
        font-size: 14px;
    }

    #piano-controls strong {
        color: #00FF00; /* 미디어파이프 초록색 뼈대 색상과 통일감 조성 */
    }

    #piano-controls label {
        cursor: pointer;
        margin-right: 5px;
    }

    #piano-controls input[type="radio"], 
    #piano-controls input[type="checkbox"] {
        cursor: pointer;
        accent-color: #00FF00; /* 체크박스 포커스 색상 매핑 */
    }

  </style>

</head>

<body>

<h1>Virtual Piano Hand Tracking</h1>

<div class="container">

  <div id="piano-controls">
      <strong> 연주 환경 설정 </strong>
      
      <div>
          <span>건반 범위 선택: </span>
          <input type="radio" id="octave1" name="octaveRange" value="1" checked onchange="changeOctaveRange(1)">
          <label for="octave1">1옥타브 (8건반)</label>
          <input type="radio" id="octave2" name="octaveRange" value="2" onchange="changeOctaveRange(2)">
          <label for="octave2">2옥타브 (15건반)</label>
      </div>

      <div>
          <input type="checkbox" id="showLabelsToggle" checked onchange="toggleLabels(this.checked)">
          <label for="showLabelsToggle">건반 음계 라벨(C, D, E...) 표시 가이드 활성화</label>
      </div>
  </div>

<!-- 1. 시작 시 모드 선택 모달 (가장 먼저 보임) -->
<div id="modeModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white;">
  <h1 style="margin-bottom: 30px;">🎹 가상 피아노</h1>
  
  <div style="display: flex; gap: 20px;">
    <button onclick="startFreeMode()" style="padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; background: #4a777a; color: white; font-weight: bold;">
      자유 연주 모드
    </button>
    <button onclick="showSongList()" style="padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 10px; border: none; background: #1b365d; color: white; font-weight: bold;">
      가이드 연주 모드
    </button>
  </div>

  <!-- '가이드 연주 모드' 클릭 시 나타나는 곡 선택 영역 -->
  <div id="songSelectBox" style="display: none; margin-top: 30px; text-align: center; background: #2c3e50; padding: 20px; border-radius: 10px;">
    <h3 style="margin-top: 0;">연주할 곡을 선택하세요</h3>
    <button onclick="startGuideMode('airplane')" style="padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; border-radius: 5px;">✈️ 비행기</button>
    <button onclick="startGuideMode('twinkle')" style="padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; border-radius: 5px;">⭐ 작은 별</button>
  </div>
</div>

<div id="guideHeader" style="display: none; position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(27, 54, 93, 0.95); color: white; padding: 12px 24px; border-radius: 12px; z-index: 50; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
  <div style="font-size: 14px; color: #e9ecef; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
    <span id="songTitleDisplay" style="font-weight: bold;">곡 제목</span>
    <button onclick="openModeModal()" style="background: rgba(255,255,255,0.15); border: 1px solid #adb5bd; color: white; border-radius: 4px; cursor: pointer; font-size: 12px; padding: 3px 8px;">모드 변경</button>
  </div>
  <!-- 오선지가 그려질 캔버스 -->
  <canvas id="sheetCanvas" width="460" height="115" style="background: #ffffff; border-radius: 8px; display: block;"></canvas>
</div>

<!-- 자유 연주 모드일 때 우측 상단 모드 변경 버튼 -->
<button id="freeModeResetBtn" onclick="openModeModal()" style="display: none; position: fixed; top: 15px; right: 20px; z-index: 50; padding: 8px 15px; background: rgba(0,0,0,0.6); color: white; border: 1px solid white; border-radius: 6px; cursor: pointer;">
  🔄 모드 선택으로
</button>



  <video class="input_video"></video>

  <canvas
          class="output_canvas"
          width="1000"
          height="700">
  </canvas>

</div>



<script src="./js/piano.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/tracking.js"></script>  <!--윤나영 05.30 추가-->
<script src="./js/pressAnalysis.js"></script> <!--이가인 06.12 추가-->
<script src="./js/coordinate.js"></script>
<script src="./js/guide.js"></script>
<script src="./js/hands.js"></script>

</body>

</html>
